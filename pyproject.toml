[project]
name = "sudoku-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["sudoku-validator", "sudoku-generator", "sudoku-vision", "sudoku-api"]

[tool.uv]
package = false

[tool.uv.sources]
sudoku-validator = { workspace = true }
sudoku-generator = { workspace = true }
sudoku-vision = { workspace = true }
sudoku-api = { workspace = true }

[tool.uv.workspace]
members = ["validator", "generator", "vision", "backend"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "C4", "RET"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
markers = ["slow: long-running tests (deselect with -m 'not slow')"]

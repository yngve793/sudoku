# Local production-like stack.
#   cp .env.example .env   # then set JWT_SECRET
#   docker compose up --build
# App:      http://localhost:8080
# Mailpit:  http://localhost:8025  (catches all outgoing email, e.g. verification links)
name: sudoku

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sudoku
      POSTGRES_PASSWORD: sudoku
      POSTGRES_DB: sudoku
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sudoku -d sudoku"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # web UI / API (SMTP 1025 stays internal)
    networks: [internal]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://sudoku:sudoku@postgres:5432/sudoku
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      COOKIE_SECURE: "false"
      EMAIL_BACKEND: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      EMAIL_FROM: Sudoku <no-reply@sudoku.local>
      # Port 8000 is NOT published; only the frontend proxy (same network) can reach it,
      # so trusting X-Forwarded-For from the internal subnet is safe.
      FORWARDED_ALLOW_IPS: 172.28.0.0/16
      PUZZLE_SOURCE: ${PUZZLE_SOURCE:-generator}
      POOL_TARGET_PER_LEVEL: ${POOL_TARGET_PER_LEVEL:-20}
      LOG_JSON: "true"
    networks: [internal]
    restart: unless-stopped

  frontend:
    build:
      context: frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks: [internal]
    restart: unless-stopped

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  pgdata:

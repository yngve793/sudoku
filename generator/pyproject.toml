[project]
name = "sudoku-generator"
version = "0.1.0"
description = "Sudoku puzzle generator with difficulty targeting"
requires-python = ">=3.12"
dependencies = ["sudoku-validator"]

[project.scripts]
sudoku-gen = "sudoku_generator.cli:main"

[tool.uv.sources]
sudoku-validator = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sudoku_generator"]

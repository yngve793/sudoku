# Served from /etc/nginx/conf.d/default.conf (included inside the `http` block).

# Honour X-Forwarded-Proto from a TLS terminator in front of us, else use our own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS: resolve `api` per request, so nginx starts even if the
    # API container is not up yet and follows it if it is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers. Locations below must not use add_header (that would drop
    # these); caching is set with `expires`, which does not affect inheritance.
    # style-src-attr allows the inline width of the progress bar; scripts and
    # stylesheets are same-origin only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # API on the same origin (required: the refresh cookie is SameSite=Strict,
    # Path=/api/v1/auth). A variable upstream without a URI keeps the request path.
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        client_max_body_size 64k;
        expires off;
    }

    # Content-hashed bundles: cache forever; never fall back to index.html.
    location /assets/ {
        try_files $uri =404;
        expires max;
        access_log off;
    }

    # The HTML shell must always be revalidated so new deploys are picked up.
    location = /index.html {
        expires -1;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA: unknown paths (e.g. /verify-email, /game/12) render the app.
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
    }
}

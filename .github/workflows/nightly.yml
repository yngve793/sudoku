name: Nightly

# Flaky-test hunt and full end-to-end run. Uses the same entry point as local development.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-full:
    name: verify.sh --full --repeat 5
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: ./scripts/verify.sh --full --repeat 5
      - name: Upload logs and Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-verify-logs
          path: |
            .verify-logs/
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
      - name: Slow generator sweep
        working-directory: generator
        run: uv run pytest --run-slow -m slow -q

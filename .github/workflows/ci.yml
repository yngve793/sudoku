name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [validator, generator, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check ${{ matrix.package }}
      - run: uv run ruff format --check ${{ matrix.package }}
      - run: uv run mypy ${{ matrix.package }}/src
      - name: Tests
        working-directory: ${{ matrix.package }}
        run: uv run pytest -m "not slow" --cov --cov-report=term-missing

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (mocked API)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

  e2e-real:
    name: End-to-end (real backend)
    runs-on: ubuntu-latest
    needs: [python, frontend]
    env:
      DATABASE_URL: sqlite:////tmp/sudoku-e2e.db
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      EMAIL_BACKEND: console
      CORS_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      COOKIE_SECURE: "false"
      RATE_LIMIT_ENABLED: "false"
      POOL_TARGET_PER_LEVEL: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
      - run: uv run alembic -c backend/alembic.ini upgrade head
      - name: Start API
        run: |
          nohup uv run uvicorn sudoku_api.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:8000/api/v1/health && break; sleep 1; done
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm run dev -- --port 5173 --strictPort > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:5173 >/dev/null && break; sleep 1; done
      - name: Playwright against real backend
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_EMAIL_LOG: /tmp/api.log
        run: npx playwright test real-backend --project=chromium
      - if: failure()
        run: tail -n 200 /tmp/api.log /tmp/web.log

  docker:
    name: Docker compose smoke test
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: sed "s/^JWT_SECRET=.*/JWT_SECRET=ci-only-secret-0123456789abcdef0123456789abcdef/" .env.example > .env
      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose --profile tools config -q
          docker compose -f docker-compose.yml -f compose.dev.yml config -q
      - run: docker compose build
      - name: nginx -t
        run: docker run --rm --read-only --tmpfs /tmp sudoku-frontend:local nginx -t
      - run: docker compose up -d --wait --wait-timeout 300
      - name: Smoke test through nginx
        run: |
          curl -fsS http://localhost:8080/ | grep -qi "<div id=\"root\""
          curl -fsS http://localhost:8080/api/v1/health
          curl -fsS "http://localhost:8080/api/v1/leaderboard?period=all"
          curl -fsS http://localhost:8025/ >/dev/null
          ./docker/smoke-test.sh
      - name: Internal ports are not published
        run: |
          if curl -fsS -m 3 http://localhost:8000/api/v1/health; then echo "api port 8000 is published" >&2; exit 1; fi
          if (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null; then echo "postgres 5432 is published" >&2; exit 1; fi
      - name: Seed one-shot (profile tools)
        run: SEED_LEVELS=easy SEED_COUNT=2 docker compose --profile tools run --rm seed
      - if: failure()
        run: docker compose --profile tools logs --no-color
      - if: always()
        run: docker compose --profile tools down -v

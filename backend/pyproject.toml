[project]
name = "sudoku-api"
version = "0.1.0"
description = "FastAPI backend for the Sudoku game"
requires-python = ">=3.12"
dependencies = [
    "sudoku-validator",
    "sudoku-generator",
    "sudoku-vision",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.1",
    "alembic>=1.14",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2",
    "slowapi>=0.1.9",
    "email-validator>=2.2",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "python-multipart>=0.0.34",
]

[project.scripts]
sudoku-api = "sudoku_api.cli:main"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]

[tool.uv.sources]
sudoku-validator = { workspace = true }
sudoku-generator = { workspace = true }
sudoku-vision = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sudoku_api"]
